; SmartWash ESP32 Firmware — PlatformIO Configuration
;
; Build and upload:
;   pio run -t upload
;   pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit ADXL345@^1.3.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.1.0
    tzapu/WiFiManager@^2.0.17

; Enable HTTPS support
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=0
